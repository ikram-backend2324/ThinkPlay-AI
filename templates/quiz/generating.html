{% extends "base.html" %}
{% block title %}{{ t.generating_headline }}{% endblock %}
{% block content %}
<div class="generating-wrap">
  <div class="spinner-3d"></div>
  <h2 id="gen-headline">{{ t.generating_headline }}</h2>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="progress-label" id="progress-label">{{ t.generating_starting }}</div>
  <button type="button" class="btn btn-ghost quiz-give-up" id="btn-give-up">{{ t.quiz_give_up }}</button>
</div>

<form method="post" action="{% url 'quiz_abandon' session.id %}" id="give-up-form" style="display:none;">
  {% csrf_token %}
</form>
{% endblock %}

{% block extra_scripts %}
<script>
  const batchUrl = "{% url 'generate_batch' session.id %}";
  const takeUrl = "{% url 'quiz_take' session.id %}";
  const GEN_I18N = {
    progress: "{{ t.generating_progress|escapejs }}",
    done: "{{ t.generating_done|escapejs }}",
    failedHeadline: "{{ t.generating_failed_headline|escapejs }}",
    failedBody: "{{ t.generating_failed_body|escapejs }}",
    retry: "{{ t.generating_retry|escapejs }}",
    giveUpConfirm: "{{ t.quiz_give_up_confirm|escapejs }}",
  };

  const btnGiveUp = document.getElementById('btn-give-up');
  const giveUpForm = document.getElementById('give-up-form');
  let cancelled = false;
  btnGiveUp.addEventListener('click', () => {
    if (window.confirm(GEN_I18N.giveUpConfirm)) {
      cancelled = true;
      giveUpForm.submit();
    }
  });

  function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
  }

  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');

  async function pump() {
    if (cancelled) return;
    try {
      const res = await fetch(batchUrl, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
      });
      if (!res.ok && res.status !== 502) throw new Error('Request failed');
      const data = await res.json();

      if (data.failed) {
        label.textContent = GEN_I18N.failedBody;
        document.getElementById('gen-headline').textContent = GEN_I18N.failedHeadline;
        return;
      }

      const pct = data.target ? Math.round((data.generated / data.target) * 100) : 0;
      fill.style.width = pct + '%';
      label.textContent = GEN_I18N.progress
        .replace('{generated}', data.generated)
        .replace('{target}', data.target);

      if (data.done) {
        label.textContent = GEN_I18N.done;
        setTimeout(() => { window.location.href = takeUrl; }, 500);
      } else {
        pump();
      }
    } catch (err) {
      label.textContent = GEN_I18N.retry;
      setTimeout(pump, 1500);
    }
  }

  pump();
</script>
{% endblock %}
